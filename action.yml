name: Repro It Release Gate
description: Run a Repro It release gate with the installed research CLI.
inputs:
  config:
    description: Path to the release-gate configuration.
    required: false
    default: .reproit/release.toml
runs:
  using: composite
  steps:
    - name: Run the release gate
      shell: bash
      env:
        REPROIT_RELEASE_CONFIG: ${{ inputs.config }}
      run: reproit-research gate --config "$REPROIT_RELEASE_CONFIG"
